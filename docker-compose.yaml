services:
  searxng:
    image: searxng/searxng:latest
    container_name: hermes-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - hermes-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  hermes:
    build: .
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./hermes-data:/home/hermes/.hermes:rw
      - ./workspace:/workspace:rw
      - ./bridge:/bridge:ro
    networks:
      - hermes-net
    security_opt:
      - no-new-privileges:true
    command: >
      bash -c "set -e;
           mkdir -p /home/hermes/.hermes/skills/groupme-notify && chmod 0755 /home/hermes/.hermes/skills/groupme-notify &&
           cp --force /opt/hermes-skills/groupme-notify/SKILL.md /home/hermes/.hermes/skills/groupme-notify/SKILL.md && chmod 0644 /home/hermes/.hermes/skills/groupme-notify/SKILL.md;
           yes | hermes skills install official/research/scrapling || true;
           python3 /bridge/bridge.py &";
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_AUTHOR_NAME=Hermes Agent
      - GIT_AUTHOR_EMAIL=hermes-agent@://github.com

networks:
  hermes-net:
    driver: bridge

